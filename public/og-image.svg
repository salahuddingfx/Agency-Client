<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#18B7F5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18B7F5;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow blobs -->
  <circle cx="150" cy="120" r="200" fill="url(#glow)" opacity="0.6"/>
  <circle cx="1050" cy="520" r="250" fill="url(#glow)" opacity="0.5"/>
  <circle cx="600" cy="300" r="150" fill="#18B7F5" opacity="0.03"/>

  <!-- Grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Logo mark -->
  <rect x="80" y="70" width="48" height="48" rx="12" fill="url(#accent)" opacity="0.9"/>
  <text x="104" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle">N</text>

  <!-- Brand name -->
  <text x="142" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="0.2em">NEXTORA</text>
  <text x="142" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#18B7F5" letter-spacing="0.3em">STUDIO</text>

  <!-- Main headline -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-0.02em">
    <tspan>Where Ideas</tspan>
  </text>
  <text x="80" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.02em">
    <tspan fill="url(#accent)">Take Shape</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" letter-spacing="0.01em">
    <tspan>Premium Software &amp; Digital Agency</tspan>
  </text>

  <!-- Service tags -->
  <rect x="80" y="390" width="120" height="32" rx="16" fill="#18B7F5" fill-opacity="0.1" stroke="#18B7F5" stroke-opacity="0.3" stroke-width="1"/>
  <text x="140" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#18B7F5" text-anchor="middle" font-weight="600">Web Dev</text>

  <rect x="215" y="390" width="120" height="32" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1"/>
  <text x="275" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="600">Mobile Apps</text>

  <rect x="350" y="390" width="120" height="32" rx="16" fill="#18B7F5" fill-opacity="0.1" stroke="#18B7F5" stroke-opacity="0.3" stroke-width="1"/>
  <text x="410" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#18B7F5" text-anchor="middle" font-weight="600">POS / ERP</text>

  <rect x="485" y="390" width="100" height="32" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1"/>
  <text x="535" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="600">UI/UX</text>

  <rect x="600" y="390" width="100" height="32" rx="16" fill="#18B7F5" fill-opacity="0.1" stroke="#18B7F5" stroke-opacity="0.3" stroke-width="1"/>
  <text x="650" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#18B7F5" text-anchor="middle" font-weight="600">AI / ML</text>

  <!-- Right side stats -->
  <rect x="820" y="180" width="300" height="280" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1"/>

  <text x="970" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">120+</text>
  <text x="970" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="0.15em">PROJECTS DELIVERED</text>

  <line x1="860" y1="280" x2="1080" y2="280" stroke="#1e293b" stroke-width="1"/>

  <text x="970" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#18B7F5" text-anchor="middle">98%</text>
  <text x="970" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="0.15em">CLIENT RETENTION</text>

  <line x1="860" y1="370" x2="1080" y2="370" stroke="#1e293b" stroke-width="1"/>

  <text x="970" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">15M+</text>
  <text x="970" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="0.15em">END USERS REACHED</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#020617"/>
  <text x="80" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">nextorastudio.tech</text>
  <text x="1120" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="end">© 2026 Nextora Studio</text>
</svg>
