<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | Nextora Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brand-primary: #18B7F5;
      --brand-secondary: #1F8EF1;
      --brand-accent: #2563EB;
      --brand-darker: #020617;
      --brand-dark: #0F172A;
      --brand-slate: #1e293b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--brand-darker);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(24, 183, 245, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -10%;
      right: 10%;
      width: 500px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(37, 99, 235, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    .wifi-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(30, 41, 59, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    .wifi-icon svg {
      width: 36px;
      height: 36px;
      stroke: var(--brand-primary);
      stroke-width: 1.5;
      fill: none;
    }

    .wifi-icon .slash {
      stroke: #ef4444;
      stroke-width: 2;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(24, 183, 245, 0.1); }
      50% { box-shadow: 0 0 30px 8px rgba(24, 183, 245, 0.08); }
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 30px -8px rgba(24, 183, 245, 0.25);
    }

    .retry-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 40px -8px rgba(24, 183, 245, 0.35);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .retry-btn svg {
      width: 16px;
      height: 16px;
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #475569;
    }

    /* Grid pattern */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <div class="wifi-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 20h.01" />
        <path d="M2 8.82a15 15 0 0 1 20 0" />
        <path d="M5 12.859a10 10 0 0 1 14 0" />
        <path d="M8.5 16.429a5 5 0 0 1 7 0" />
        <line class="slash" x1="3" y1="3" x2="21" y2="21" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p class="subtitle">
      It looks like you've lost your internet connection.<br />
      Please check your network and try again.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
      Try Again
    </button>
    <p class="hint">Nextora Studio &mdash; Where Ideas Take Shape</p>
  </div>
</body>
</html>
